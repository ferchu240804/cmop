<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrate</title>
    <link rel="stylesheet" href="css.css" defer>
</head>
<body>

    <header>
        <h2 class="logo">logo</h2>
        <nav class="navegacion">
            <a href="sabermas.html">Saber mas</a>
            <a href="servicios.html">Servicios</a>
            <a href="contactos.html">Contactos</a>
            <a href="inicio.html">Inicio</a>
            <button class="btnLogin-popup">Login</button>
            <div id="mensaje-error" style="color: red; display: none;"></div>

        </nav>
    </header>
    <form id="loginform">
    <div class="cuadro">
        <span class="icon-close"><ion-icon name="close-outline"></ion-icon></span>

        <div class="form-box login">
            <h2>Login</h2>
            <form action="#">
                <div class="input-box">
                    <span class="icon"><ion-icon name="mail-outline"></ion-icon></span>
                    <input type="email" required id="email">
                    <label>Email</label>
                </div>
                <div class="input-box">
                    <span class="icon"><ion-icon name="lock-closed-outline"></ion-icon></span>
                    <input type="password" required id="password">
                    <label>Contraseña</label>
                </div>
                <div class="rememver-forgot">
                    <label><input type="checkbox">Recuerdamelo</label>
                    <a href="#">Olvidaste tu contraseña?</a>
                </div>
                <button type="submit" class="btn">Login</button>
                <div class="login-register">
                    <p>No tienes una cuenta?</p>
                    <p><a href="#" class="register-link">Registrate</a></p>

                </div>
            </form>
        </div>


        <div class="form-box register">
            <form id="registerform"></form>
            <h2>Registrarse</h2>
            <form action="#">
                <div class="input-box">
                    <span class="icon"><ion-icon name="person-outline"></ion-icon></span>
                    <input type="text" required id="user">
                    <label>Username</label>
                </div>
                <div class="input-box">
                    <span class="icon"><ion-icon name="mail-outline"></ion-icon></span>
                    <input type="email" required id="emailR">
                    <label>Email</label>
                </div>
                <div class="input-box">
                    <span class="icon"><ion-icon name="lock-closed-outline"></ion-icon></span>
                    <input type="password" required id="passwordR">
                    <label>Contraseña</label>
                </div>
                <div class="rememver-forgot">
                    <label><input type="checkbox">Acepto los terminos y condiciones</label>
                </div>
                <button type="submit" class="btn" id="login-register">Registarse</button>
                <div class="login-register">
                    <p>Ya tienes una cuenta?</p>
                    <p><a href="#" class="login-link">Inicia sesion</a></p>

                </div>
                </form>
            </form>
        </div>
    </div>


    <script src="js.js" defer></script>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    
</body>
</html>
