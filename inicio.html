<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Define el tipo de documento como HTML5 -->
    <meta charset="UTF-8">
    <!-- Ajusta el diseño para que sea responsivo en dispositivos móviles -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Vincula la hoja de estilos CSS -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="inicio.css" defer>
    <!-- Carga el script para los íconos de Ionicons -->
    <script src="https://cdn.jsdelivr.net/npm/ionicons@6.0.0/dist/ionicons.js"></script>
    <!-- Título que aparecerá en la pestaña del navegador -->
    <title>Inicio</title>
</head>
<body>
    <!-- Encabezado principal de la página -->
    <header>
        <!-- Título del sitio -->
        <h1>INICIO</h1>
        <!-- Texto descriptivo -->
        <p class="info-text">Sitios</p>
    </header>
    
    <!-- Primera sección de contenido -->
    <section class="content">
        <!-- Enlace a la página de procesadores -->
        <a href="CARPETADEJUEGOS.HTML" class="card">
            <!-- Imagen representativa de procesadores -->
            <img src="games.png" alt="GAMES">
            <!-- Texto descriptivo -->
            <p>Juegos</p>
        </a>
    </section>
    
    <!-- Segunda sección de contenido -->
    <section class="content">
        <!-- Enlace a la página de tarjetas gráficas -->
        <a href="COMPRAS.HTML" class="card">
            <!-- Imagen representativa de tarjetas gráficas -->
            <img src="compras.jpg" alt="Mercado">
            <!-- Texto descriptivo -->
            <p>Compras</p>
        </a>
    </section>
    
    <!-- Pie de página -->
    <footer>
        <!-- Texto del pie de página -->
        <p>Contáctanos en WhatsApp</p>
        <!-- Enlace directo a WhatsApp con un mensaje predefinido -->
        <a href="https://wa.me/595981919031?text=¡Buenas!%20le%20escribo%20para%20consultar%20por%20tal%20producto😀" target="_blank" class="icon">
            <!-- Ícono de WhatsApp -->
            <ion-icon name="logo-whatsapp"></ion-icon>
        </a>
    </footer>
</body>
</html>
